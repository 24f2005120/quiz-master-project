<div
  class="modal fade"
  id="{{ modal_id }}"
  tabindex="-1"
  aria-labelledby="{{ modal_id }}Label"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="{{ modal_id }}Label">{{ title }}</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <form id="{{ modal_id }}Form" action="{{ action }}" method="POST">
          {{ form.hidden_tag() }}
          <!-- CSRF token -->
          {% for field in form if field.widget.input_type != 'hidden' %}
          <div class="mb-3">
            <label class="form-label" for="{{ field.id }}"
              >{{ field.label.text }}</label
            >
            {{ field(class="form-control") }} {% if field.errors %}
            <div class="text-danger">
              {% for error in field.errors %}
              <small>{{ error }}</small>
              {% endfor %}
            </div>
            {% endif %}
          </div>
          {% endfor %}
          <button type="submit" class="btn btn-success">Submit</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll(".modal form").forEach((form) => {
      form.addEventListener("submit", function (event) {
        event.preventDefault();
        const formData = new FormData(form);
        const modalId = form.closest(".modal").id; // Get the modal ID dynamically

        fetch(form.action, {
          method: "POST",
          body: formData,
        })
          .then((response) => response.json())
          .then((data) => {
            if (data.message) {
              // Show the toast notification
              var toastEl = document.getElementById("liveToast");
              var toast = new bootstrap.Toast(toastEl);
              toast.show();

              // Optionally, reload the page after a short delay if you want updated content
              setTimeout(() => window.location.reload(), 1500);
            } else if (data.errors) {
              // Format error messages
              let errorMessage = "";
              Object.keys(data.errors).forEach((field) => {
                errorMessage += `${field}: ${data.errors[field].join(", ")}<br>`;
              });
              // Insert the error message into the error toast body
              document.querySelector("#errorToast .toast-body").innerHTML =
                errorMessage;
              // Show the error toast
              const errorToastEl = document.getElementById("errorToast");
              const errorToast = new bootstrap.Toast(errorToastEl);
              errorToast.show();
            }
          })
          .catch((error) => console.error("Error:", error));
      });
    });

    function displayFormErrors(form, errors) {
      form.querySelectorAll(".text-danger").forEach((el) => el.remove()); // Remove old errors
      Object.keys(errors).forEach((field) => {
        const inputField = form.querySelector(`[name="${field}"]`);
        if (inputField) {
          const errorDiv = document.createElement("div");
          errorDiv.className = "text-danger";
          errorDiv.innerHTML = errors[field].join("<br>");
          inputField.parentElement.appendChild(errorDiv);
        }
      });
    }
  });
</script>

<!-- Toast Container -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div
    id="liveToast"
    class="toast"
    role="alert"
    aria-live="assertive"
    aria-atomic="true"
  >
    <div class="toast-header">
      <strong class="me-auto">Notification</strong>
      <small>Just now</small>
      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="toast"
        aria-label="Close"
      ></button>
    </div>
    <div class="toast-body">Subject created successfully!</div>
  </div>
</div>

<!-- Error Toast Container -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div
    id="errorToast"
    class="toast"
    role="alert"
    aria-live="assertive"
    aria-atomic="true"
  >
    <div class="toast-header bg-danger text-white">
      <strong class="me-auto">Error</strong>
      <button
        type="button"
        class="btn-close btn-close-white"
        data-bs-dismiss="toast"
        aria-label="Close"
      ></button>
    </div>
    <div class="toast-body">
      <!-- Error messages will be inserted here -->
    </div>
  </div>
</div>
