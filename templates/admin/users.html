{% extends "base.html" %} {% block title %} Users {% endblock %} {% block body
%} {% include "admin/nav.html" %}
<script src="{{ url_for('static', filename='admin_scripts.js') }}"></script>

<div class="container py-5">
  <h2>Users</h2>
  <div row row-cols-1 row-cols-md-2 row-cols-lg-3>
    <div
      class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 mb-5"
      id="userList"
    >
      {% for user in users %}
      <div class="col user-card">
        <div class="card shadow-sm border-0 h-100">
          <div
            class="card-header bg-light d-flex justify-content-between align-items-center"
          >
            <h5 class="fw-semibold mb-0">{{ user.username }}</h5>
          </div>
          <div class="card-body p-4 d-flex flex-column justify-content-between">
            <!-- Container for Radial Chart -->

            <div style="width: 200px; height: 200px; margin: 10px auto">
              <canvas
                id="userChart_{{ user.user_id }}"
                class="user-chart-canvas"
                data-chart-labels='{{user_data[user.user_id]['labels']|tojson}}'
                data-chart-data='{{user_data[user.user_id]['data']|tojson}}'
              ></canvas>
            </div>

            <div class="mt-3 text-center">
              <a
                href="{{ url_for('admin.user_details', user_id=user.user_id) }}"
              >
                <button class="btn btn-secondary w-100">
                  <i class="bi bi-eye"></i> View Details
                </button>
              </a>
            </div>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
<!-- Include Chart.js library -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const userCards = document.querySelectorAll(".user-card");

    userCards.forEach((card) => {
      const canvas = card.querySelector(".user-chart-canvas"); // Get the canvas inside the card
      const canvasId = canvas.id;
      const ctx = document.getElementById(canvasId).getContext("2d");

      console.log(
        "Raw data-chartLabels attribute:",
        canvas.dataset.chartLabels,
      );

      const chartLabels = JSON.parse(canvas.dataset.chartLabels); // Parse JSON string to array
      const chartData = JSON.parse(canvas.dataset.chartData); // Parse JSON string to array
      new Chart(ctx, {
        type: "radar", // Radial chart type
        data: {
          labels: chartLabels,
          datasets: [
            {
              label: "User Performance",
              data: chartData,
              fill: true,
              backgroundColor: "rgba(54, 162, 235, 0.2)", // Blue with opacity
              borderColor: "rgb(54, 162, 235)",
              pointBackgroundColor: "rgb(54, 162, 235)",
              pointBorderColor: "#fff",
              pointHoverBackgroundColor: "#fff",
              pointHoverBorderColor: "rgb(54, 162, 235)",
            },
          ],
        },
        options: {
          scales: {
            r: {
              suggestedMin: 0,
              suggestedMax: 100, // Assuming data is percentage-based
            },
          },
        },
      });
    });
  });
</script>

{% endblock %}
