<div class="container mt-4">
  <h2 class="mb-3">Subjects</h2>

  {% for subject in subjects %}
  <div class="card mb-3 shadow-sm">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h4 class="mb-0">{{ subject.subject_name }}</h4>
      <button
        class="btn btn-danger btn-sm"
        onclick="deleteSubject({{ subject.subject_id }})"
      >
        <i class="bi bi-trash"></i> Delete Subject
      </button>
    </div>

    <div class="card-body">
      {% if subject.chapters %}
      <ul class="list-group">
        {% for chapter in subject.chapters %}
        <li
          class="list-group-item d-flex justify-content-between align-items-center"
        >
          <span>
            <strong>{{ chapter.chapter_id }}</strong> - {{ chapter.chapter_name
            }}
          </span>
          <button
            class="btn btn-outline-danger btn-sm"
            onclick="deleteChapter({{ chapter.id }})"
          >
            <i class="bi bi-x-circle"></i> Remove
          </button>
        </li>
        {% endfor %}
      </ul>
      {% else %}
      <p class="text-muted">No chapters added yet.</p>
      {% endif %}
    </div>
  </div>
  {% endfor %}
</div>

<script>
  // Get the delete URLs dynamically
  const deleteSubjectUrl = "{{ url_for('admin.delete_subject', subject_id=0)}}";
  const deleteChapterUrl =
    "{{ url_for('admin.delete_chapter', chapter_id=0) }}";

  function deleteSubject(subjectId) {
    if (!confirm("Are you sure you want to delete this subject?")) return;

    // Dynamically construct the URL with the subjectId
    const url = deleteSubjectUrl + subjectId;

    fetch(url, { method: "DELETE" })
      .then((response) => response.json())
      .then((data) => {
        if (data.message) {
          showToast(data.message, "success");
          setTimeout(() => window.location.reload(), 300);
        } else if (data.errors) {
          showToast(data.errors, "error");
        }
      })
      .catch(() => showToast("Error deleting subject.", "danger"));
  }
</script>
